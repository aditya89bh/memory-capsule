[project]
name = "memory-capsule"
version = "0.2.0"
description = "Portable memory file and store for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "sentence-transformers",
  "faiss-cpu",
  "numpy",
]

[project.scripts]
memory-capsule = "capsule.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
